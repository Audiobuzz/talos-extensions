# The "base" stage every extension builds on: the Talos tools image (musl
# toolchain, Go, meson/ninja, libnl, OpenSSL headers) plus the
# extensions-validator binary used in each package's test step. Same shape
# as siderolabs/extensions/internal/base.
name: base
variant: scratch
shell: /bin/bash
dependencies:
  - image: "{{ .BUILD_ARG_TOOLS_PREFIX }}/tools:{{ .BUILD_ARG_TOOLS }}"
  - image: ghcr.io/siderolabs/extensions-validator:c0c37e7
finalize:
  - from: /
    to: /
